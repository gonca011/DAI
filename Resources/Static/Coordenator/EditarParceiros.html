<!DOCTYPE html>
<html>

<head>
    <title>Editar Parceiro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Centrar.css">
    <link rel="stylesheet" href="Caixas.css">
    <link rel="stylesheet" href="Botoes.css">
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
    </style>
</head>

<body class="fundo">
    <div class="container">
        <div class="boxRegisto">
            <h2>Editar Parceiro</h2>
            <form action="http://localhost:8080/editarParceiro" method="post">
                <div class="inputBox utilizado">
                    <input type="text" id="id" name="id" required>
                    <label for="id">ID do Parceiro</label>
                </div>
                <div class="inputBox">
                    <input type="text" name="nome" required>
                    <label for="nome">Nome</label>
                </div>
                <div class="inputBox">
                    <input type="text" name="descricao" required>
                    <label for="descricao">Descrição</label>
                </div>
                <button type="submit" class="botao-proximo1">Guardar</button>
            </form>
            <a href="AdicionarParceiros.html" class="botao-voltaradd">Voltar</a>
        </div>
        <div class="boxRegisto2d">
            <h2>Lista atual de Parceiros</h2>
            <ul id="parceirosList"></ul>
            <script>
                fetch('http://localhost:8080/listarParceiros')
                    .then(response => response.json())
                    .then(data => {
                        const parceirosList = document.getElementById('parceirosList');

                        data.forEach(parceiro => {
                            const li = document.createElement('li');
                            li.textContent = `Nome: ${parceiro.nome}, Descricao: ${parceiro.descricao}, ID: ${parceiro.id}`;
                            parceirosList.appendChild(li);
                        });
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
            </script>
        </div>
    </div>
</body>

</html>
